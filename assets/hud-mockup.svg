<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="hudWindowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="hudBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="dwellRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="transcriptBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .bone { stroke: #38bdf8; stroke-width: 2.5; stroke-linecap: round; opacity: 0.85; }
      .joint { fill: #c084fc; stroke: #38bdf8; stroke-width: 1.5; }
      .tip { fill: #f472b6; stroke: #fff; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="2" y="2" width="956" height="536" rx="12" fill="url(#hudWindowBg)" stroke="#334155" stroke-width="2" />

  <!-- Window Header Bar -->
  <path d="M 2,14 Q 2,2 14,2 L 946,2 Q 958,2 958,14 L 958,42 L 2,42 Z" fill="url(#hudBarGrad)" />
  <circle cx="22" cy="22" r="6" fill="#ef4444" />
  <circle cx="42" cy="22" r="6" fill="#f59e0b" />
  <circle cx="62" cy="22" r="6" fill="#10b981" />

  <text x="480" y="27" class="mono" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">signora &middot; live recognition HUD</text>

  <!-- Header Indicators -->
  <g transform="translate(810, 14)">
    <circle cx="8" cy="8" r="4" fill="#10b981" filter="url(#hudGlow)" />
    <text x="18" y="12" class="mono" font-size="11" font-weight="700" fill="#10b981">LIVE</text>
    <text x="64" y="12" class="mono" font-size="11" fill="#64748b">30 FPS</text>
  </g>

  <!-- Left HUD Telemetry Box -->
  <g transform="translate(28, 62)">
    <rect width="180" height="110" rx="8" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="14" y="24" class="sans" font-size="10.5" font-weight="700" fill="#64748b">HARDWARE DELEGATE</text>
    <text x="14" y="42" class="mono" font-size="12" font-weight="700" fill="#38bdf8">CPU (SIMD / XNNPACK)</text>

    <text x="14" y="66" class="sans" font-size="10.5" font-weight="700" fill="#64748b">FEATURE VECTOR</text>
    <text x="14" y="84" class="mono" font-size="12" font-weight="700" fill="#c084fc">74D Geometric Norm</text>
    <text x="14" y="98" class="mono" font-size="9" fill="#94a3b8">21 Hand Landmarks</text>
  </g>

  <!-- Camera Hand Tracking Graphics (Center) -->
  <g transform="translate(450, 110)">
    <!-- Palm & wrist bones -->
    <line x1="0" y1="190" x2="-35" y2="125" class="bone" />
    <line x1="-35" y1="125" x2="-25" y2="80" class="bone" />
    <line x1="-25" y1="80" x2="-5" y2="60" class="bone" />
    <line x1="-5" y1="60" x2="10" y2="65" class="bone" />

    <!-- Wrist to MCPs -->
    <line x1="0" y1="190" x2="-25" y2="80" class="bone" opacity="0.4" />
    <line x1="0" y1="190" x2="5" y2="75" class="bone" opacity="0.4" />
    <line x1="0" y1="190" x2="35" y2="85" class="bone" opacity="0.4" />
    <line x1="0" y1="190" x2="65" y2="105" class="bone" opacity="0.4" />

    <!-- MCP palm arch -->
    <line x1="-25" y1="80" x2="5" y2="75" class="bone" />
    <line x1="5" y1="75" x2="35" y2="85" class="bone" />
    <line x1="35" y1="85" x2="65" y2="105" class="bone" />

    <!-- Index finger (extended upright) -->
    <line x1="-25" y1="80" x2="-30" y2="25" class="bone" />
    <line x1="-30" y1="25" x2="-32" y2="-25" class="bone" />
    <line x1="-32" y1="-25" x2="-33" y2="-75" class="bone" />

    <!-- Middle finger (extended upright) -->
    <line x1="5" y1="75" x2="3" y2="15" class="bone" />
    <line x1="3" y1="15" x2="2" y2="-35" class="bone" />
    <line x1="2" y1="-35" x2="1" y2="-85" class="bone" />

    <!-- Ring finger (extended upright) -->
    <line x1="35" y1="85" x2="37" y2="25" class="bone" />
    <line x1="37" y1="25" x2="38" y2="-25" class="bone" />
    <line x1="38" y1="-25" x2="39" y2="-72" class="bone" />

    <!-- Pinky finger (extended upright) -->
    <line x1="65" y1="105" x2="70" y2="55" class="bone" />
    <line x1="70" y1="55" x2="73" y2="10" class="bone" />
    <line x1="73" y1="10" x2="75" y2="-35" class="bone" />

    <!-- Joints -->
    <!-- Wrist (0) -->
    <circle cx="0" cy="190" r="5" class="joint" />
    <!-- Thumb (1..4) -->
    <circle cx="-35" cy="125" r="4.5" class="joint" />
    <circle cx="-25" cy="80" r="4.5" class="joint" />
    <circle cx="-5" cy="60" r="4" class="joint" />
    <circle cx="10" cy="65" r="4.5" class="tip" />
    <!-- Index (5..8) -->
    <circle cx="-30" cy="25" r="4" class="joint" />
    <circle cx="-32" cy="-25" r="4" class="joint" />
    <circle cx="-33" cy="-75" r="5" class="tip" />
    <!-- Middle (9..12) -->
    <circle cx="5" cy="75" r="4.5" class="joint" />
    <circle cx="3" cy="15" r="4" class="joint" />
    <circle cx="2" cy="-35" r="4" class="joint" />
    <circle cx="1" cy="-85" r="5" class="tip" />
    <!-- Ring (13..16) -->
    <circle cx="35" cy="85" r="4.5" class="joint" />
    <circle cx="37" cy="25" r="4" class="joint" />
    <circle cx="38" cy="-25" r="4" class="joint" />
    <circle cx="39" cy="-72" r="5" class="tip" />
    <!-- Pinky (17..20) -->
    <circle cx="65" cy="105" r="4.5" class="joint" />
    <circle cx="70" cy="55" r="4" class="joint" />
    <circle cx="73" cy="10" r="4" class="joint" />
    <circle cx="75" cy="-35" r="5" class="tip" />
  </g>

  <!-- Right Recognition Overlay Box -->
  <g transform="translate(730, 80)">
    <rect width="200" height="240" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <text x="100" y="32" class="sans" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">ACTIVE PREDICTION</text>

    <!-- Dwell Progress Ring -->
    <g transform="translate(100, 110)">
      <!-- Background track -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#1e293b" stroke-width="7" />
      <!-- Progress indicator (75% filled) -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="url(#dwellRingGrad)" stroke-width="7" stroke-dasharray="226 75" stroke-linecap="round" transform="rotate(-90)" filter="url(#hudGlow)" />
      <!-- Letter -->
      <text x="0" y="16" class="sans" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle">B</text>
    </g>

    <!-- Metrics -->
    <text x="100" y="188" class="mono" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">98.4% CONFIDENCE</text>
    <text x="100" y="208" class="mono" font-size="11" fill="#38bdf8" text-anchor="middle">DWELLING &middot; 780/1000ms</text>
    <rect x="30" y="218" width="140" height="4" rx="2" fill="#1e293b" />
    <rect x="30" y="218" width="110" height="4" rx="2" fill="#38bdf8" />
  </g>

  <!-- Transcript Bar -->
  <g transform="translate(24, 380)">
    <rect width="912" height="74" rx="10" fill="url(#transcriptBg)" stroke="#334155" stroke-width="1.2" />
    <text x="24" y="26" class="sans" font-size="10.5" font-weight="700" fill="#64748b">LIVE TRANSCRIPT BUFFER</text>
    <text x="24" y="54" class="mono" font-size="22" font-weight="700" fill="#f8fafc">HELLO WORLD<tspan fill="#38bdf8">▌</tspan></text>
    <text x="888" y="52" class="mono" font-size="11" fill="#94a3b8" text-anchor="end">11 characters recorded</text>
  </g>

  <!-- Controls Footer -->
  <g transform="translate(24, 474)">
    <rect width="912" height="46" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="28" class="mono" font-size="11.5" fill="#f8fafc">
      <tspan fill="#38bdf8" font-weight="700">[C]</tspan> Clear  &nbsp;&nbsp;
      <tspan fill="#f472b6" font-weight="700">[R]</tspan> Speak TTS  &nbsp;&nbsp;
      <tspan fill="#fbbf24" font-weight="700">[⌫ Backspace]</tspan> Delete  &nbsp;&nbsp;
      <tspan fill="#34d399" font-weight="700">[F]</tspan> Fullscreen  &nbsp;&nbsp;
      <tspan fill="#ef4444" font-weight="700">[Q]</tspan> Quit
    </text>
    <text x="888" y="28" class="mono" font-size="11" fill="#94a3b8" text-anchor="end">
      In-Air Gesture: <tspan fill="#c084fc" font-weight="700">[␣] Thumb-to-Palm</tspan> inserts space
    </text>
  </g>
</svg>
