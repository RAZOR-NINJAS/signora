<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 110" width="100%" height="100%">
  <defs>
    <linearGradient id="typeCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      @keyframes flowDot {
        0% { transform: translateX(0); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(36px); opacity: 0; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .flow-pulse { animation: flowDot 2s infinite ease-in-out; }
      .cursor-blink { animation: blinkCursor 1s infinite; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="756" height="106" rx="14" fill="url(#typeCardBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Step 1: Sign Capture -->
  <g transform="translate(24, 22)">
    <rect width="148" height="66" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="33" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="28" y="38" text-anchor="middle" font-size="14">🤟</text>
    <text x="52" y="28" class="sans" font-size="11" font-weight="700" fill="#f8fafc">SIGN GESTURE</text>
    <text x="52" y="44" class="mono" font-size="10" fill="#94a3b8">21 Landmarks</text>
    <text x="52" y="56" class="mono" font-size="9" fill="#38bdf8">Hold steady…</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(182, 50)">
    <path d="M 0,5 L 26,5 M 20,0 L 26,5 L 20,10" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="10" cy="5" r="2.5" fill="#38bdf8" class="flow-pulse" />
  </g>

  <!-- Step 2: Dwell Lock -->
  <g transform="translate(218, 22)">
    <rect width="148" height="66" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="33" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <text x="28" y="38" text-anchor="middle" font-size="13">⏳</text>
    <text x="52" y="28" class="sans" font-size="11" font-weight="700" fill="#f8fafc">DWELL LOCK</text>
    <text x="52" y="44" class="mono" font-size="10" fill="#94a3b8">800ms Buffer</text>
    <text x="52" y="56" class="mono" font-size="9" fill="#c084fc">Confirmed: "B"</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(376, 50)">
    <path d="M 0,5 L 26,5 M 20,0 L 26,5 L 20,10" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="10" cy="5" r="2.5" fill="#c084fc" class="flow-pulse" />
  </g>

  <!-- Step 3: Text Transcript -->
  <g transform="translate(412, 22)">
    <rect width="170" height="66" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="33" r="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
    <text x="26" y="38" text-anchor="middle" font-size="13">💬</text>
    <text x="48" y="28" class="sans" font-size="11" font-weight="700" fill="#f8fafc">TRANSCRIPT</text>
    <text x="48" y="46" class="mono" font-size="12" font-weight="700" fill="#34d399">HELLO WORLD<tspan class="cursor-blink" fill="#38bdf8">▌</tspan></text>
    <text x="48" y="58" class="mono" font-size="9" fill="#64748b">[C] Clear · [␣] Space</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(592, 50)">
    <path d="M 0,5 L 26,5 M 20,0 L 26,5 L 20,10" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="10" cy="5" r="2.5" fill="#34d399" class="flow-pulse" />
  </g>

  <!-- Step 4: Piper Voice Output -->
  <g transform="translate(628, 22)">
    <rect width="108" height="66" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="33" r="14" fill="#0f172a" stroke="#f472b6" stroke-width="1.5" />
    <text x="26" y="38" text-anchor="middle" font-size="13">🔊</text>
    <text x="48" y="28" class="sans" font-size="11" font-weight="700" fill="#f8fafc">PIPER TTS</text>
    <text x="48" y="44" class="mono" font-size="10" fill="#f472b6">100% Offline</text>
    <text x="48" y="56" class="mono" font-size="9" fill="#94a3b8">Press [R] to Speak</text>
  </g>
</svg>
