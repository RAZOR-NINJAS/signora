[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signora"
version = "0.1.1"
description = "Real-time sign language recognition engine (ISL, ASL letters & words). 100% offline, local neural inference."
readme = "README.md"
authors = [{ name = "Vaibhav Singh Shekhawat", email = "vaibhavthegoat123@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11, <3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mediapipe==0.10.21",
    "opencv-python>=4.8,<5",
    "numpy>=1.24,<2",
    "torch>=2.2",
    "rich>=13.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
gpu = [
    "torch>=2.2",
]

[project.scripts]
signora = "signora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
